<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Solvane</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="{{ url_for('home') }}" class="logo">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Logo">
            <span>Solvane</span>
        </a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('trips') }}">Trips</a>
            <a href="{{ url_for('booking') }}">Booking</a>
        </div>
    </div>
</nav>

<!-- جدول الحجوزات -->
<section class="section">
    <h2>All Bookings</h2>
    <table border="1" style="width:100%; border-collapse:collapse; margin-top:20px;">
        <tr style="background:#003566; color:white;">
            <th style="padding:10px;">#</th>
            <th style="padding:10px;">Name</th>
            <th style="padding:10px;">Email</th>
            <th style="padding:10px;">Phone</th>
            <th style="padding:10px;">Travelers</th>
            <th style="padding:10px;">Date</th>
        </tr>
        {% for b in bookings %}
        <tr style="text-align:center;">
            <td style="padding:8px;">{{ b.id }}</td>
            <td style="padding:8px;">{{ b.name }}</td>
            <td style="padding:8px;">{{ b.email }}</td>
            <td style="padding:8px;">{{ b.phone }}</td>
            <td style="padding:8px;">{{ b.travelers }}</td>
            <td style="padding:8px;">{{ b.date }}</td>
        </tr>
        {% endfor %}
    </table>
</section>

<footer>
    <p>©️ 2025 Solvane. All rights reserved.</p>
</footer>

</body>
</html>
